<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" role="img" aria-labelledby="title desc"><title id="title">Uma bomba mantém diferenças que outras proteínas utilizam</title><desc id="desc">Transporte ativo primário e secundário são mecanismos relacionados, mas diferentes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#477b71"/></marker></defs><rect width="1060" height="760" fill="#fffdf7"/><style>text{font-family:Arial,sans-serif;fill:#153b37}.t{font-size:28px;font-weight:700}.s{font-size:18px}.h{font-size:21px;font-weight:700}.b{font-size:18px}.foot{font-size:17px}</style><text class="t" x="40" y="52">Uma bomba mantém diferenças que outras proteínas utilizam</text><text class="s" x="40" y="87">Transporte ativo primário e secundário são mecanismos relacionados, mas diferentes.</text><rect x="40" y="130" width="480" height="212" rx="14" fill="#e8f3ee" stroke="#b7ccc1"/><text class="h" x="62" y="168">1 · ATP e mudança de estado</text><text class="b" x="62" y="208">A Na⁺/K⁺-ATPase liga íons e utiliza ATP.</text><text class="b" x="62" y="237">Mudanças de conformação alternam</text><text class="b" x="62" y="266">a exposição dos locais de ligação</text><text class="b" x="62" y="295">entre os dois lados da membrana.</text><rect x="560" y="130" width="480" height="212" rx="14" fill="#eef0f9" stroke="#b7ccc1"/><text class="h" x="582" y="168">2 · Resultado de um ciclo usual</text><text class="b" x="582" y="208">3 Na⁺ são transportados para fora.</text><text class="b" x="582" y="237">2 K⁺ são transportados para dentro.</text><text class="b" x="582" y="266">O processo ajuda a sustentar</text><text class="b" x="582" y="295">gradientes químicos e elétricos.</text><rect x="40" y="380" width="480" height="212" rx="14" fill="#faf0db" stroke="#b7ccc1"/><text class="h" x="62" y="418">4 · Dependência indireta de ATP</text><text class="b" x="62" y="458">O cotransportador não precisa</text><text class="b" x="62" y="487">hidrolisar ATP em cada passagem.</text><text class="b" x="62" y="516">Mas o gradiente depende da bomba:</text><text class="b" x="62" y="545">sem manutenção, ele se dissipa.</text><rect x="560" y="380" width="480" height="212" rx="14" fill="#edf4f7" stroke="#b7ccc1"/><text class="h" x="582" y="418">3 · Uso por outro transportador</text><text class="b" x="582" y="458">Na⁺ pode entrar a favor do gradiente</text><text class="b" x="582" y="487">acoplado à entrada de glicose</text><text class="b" x="582" y="516">contra seu próprio gradiente</text><text class="b" x="582" y="545">em células com esse mecanismo.</text><path d="M527 236 L551 236" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M800 350 L800 370" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M550 488 L528 488" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="40" y="650" width="1000" height="80" rx="10" fill="#f1f1e8"/><text class="foot" x="60" y="679">Gradiente eletroquímico = contribuição da concentração + contribuição da diferença de voltagem.</text><text class="foot" x="60" y="706">Limite: não descreve todos os transportadores nem a distribuição de íons em qualquer célula.</text></svg>