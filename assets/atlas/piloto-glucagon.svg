<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>O glucagon altera o trabalho das enzimas por sinalização</title><defs><marker id="matter" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d68"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8954ab"/></marker></defs><style>text{font-family:Arial,sans-serif}</style><rect width="960" height="540" fill="#fffdf7"/><text x="30" y="38" font-size="25" fill="#173d3b" text-anchor="start">O glucagon altera o trabalho das enzimas por sinalização</text><rect x="55" y="120" width="850" height="340" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="80" y="159" font-size="19" fill="#173d3b" text-anchor="start">Sangue / meio extracelular</text><text x="80" y="435" font-size="20" fill="#173d3b" text-anchor="start">Interior do hepatócito (célula do fígado)</text><path d="M70 210 H890" stroke="#176d68" stroke-width="12"/><rect x="160" y="181" width="45" height="60" rx="5" fill="#f0ddff" stroke="#8954ab" stroke-width="2"/><circle cx="182" cy="159" r="12" fill="#8954ab"/><text x="350" y="166" font-size="19" fill="#173d3b" text-anchor="start">Glucagon liga-se ao seu receptor</text><rect x="110" y="270" width="210" height="75" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="130" y="303" font-size="21" fill="#173d3b" text-anchor="start">Proteína Gs</text><text x="130" y="331" font-size="17" fill="#173d3b" text-anchor="start">ativa adenilato-ciclase</text><rect x="375" y="270" width="210" height="75" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="395" y="303" font-size="21" fill="#173d3b" text-anchor="start">ATP → AMPc</text><text x="395" y="331" font-size="17" fill="#173d3b" text-anchor="start">segundo mensageiro</text><rect x="650" y="270" width="190" height="75" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="670" y="303" font-size="21" fill="#173d3b" text-anchor="start">PKA ativa</text><text x="670" y="331" font-size="17" fill="#173d3b" text-anchor="start">modifica proteínas</text><path d="M182 248 L182 262" stroke="#8954ab" fill="none" stroke-width="3" marker-end="url(#signal)" stroke-dasharray="8 6"/><path d="M327 309 L366 309" stroke="#8954ab" fill="none" stroke-width="3" marker-end="url(#signal)" stroke-dasharray="8 6"/><path d="M592 309 L642 309" stroke="#8954ab" fill="none" stroke-width="3" marker-end="url(#signal)" stroke-dasharray="8 6"/><text x="80" y="390" font-size="18" fill="#173d3b" text-anchor="start">Uma consequência: cascata enzimática favorece a degradação do glicogênio.</text><text x="30" y="523" font-size="16" fill="#59726e" text-anchor="start">Esquema didático em português · posições e quantidades não estão em escala</text></svg>