<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Uma célula com dois lados permite absorção orientada</title><defs><marker id="matter" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d68"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8954ab"/></marker></defs><style>text{font-family:Arial,sans-serif}</style><rect width="960" height="540" fill="#fffdf7"/><text x="30" y="38" font-size="25" fill="#173d3b" text-anchor="start">Uma célula com dois lados permite absorção orientada</text><rect x="310" y="110" width="340" height="310" rx="28" fill="#fff1dc" stroke="#d38316" stroke-width="2"/><text x="35" y="117" font-size="22" fill="#173d3b" text-anchor="start">Lúmen intestinal</text><text x="700" y="117" font-size="22" fill="#173d3b" text-anchor="start">Meio interno</text><text x="328" y="410" font-size="21" fill="#173d3b" text-anchor="start">Célula epitelial intestinal</text><text x="328" y="145" font-size="18" fill="#173d3b" text-anchor="start">Lado apical</text><text x="518" y="145" font-size="18" fill="#173d3b" text-anchor="start">Basolateral</text><rect x="292" y="180" width="36" height="60" rx="5" fill="#cde9e1" stroke="#176d68" stroke-width="2"/><text x="215" y="170" font-size="19" fill="#173d3b" text-anchor="start">SGLT1</text><path d="M160 205 L350 205" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><text x="65" y="191" font-size="19" fill="#173d3b" text-anchor="start">Na⁺ + glicose</text><text x="350" y="193" font-size="17" fill="#173d3b" text-anchor="start">Entrada acoplada</text><rect x="632" y="180" width="36" height="60" rx="5" fill="#cde9e1" stroke="#176d68" stroke-width="2"/><text x="680" y="170" font-size="19" fill="#173d3b" text-anchor="start">GLUT2</text><path d="M525 205 L810 205" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><text x="700" y="244" font-size="18" fill="#173d3b" text-anchor="start">Glicose → capilares</text><rect x="632" y="290" width="36" height="60" rx="5" fill="#e0d1ff" stroke="#8954ab" stroke-width="2"/><text x="690" y="288" font-size="18" fill="#173d3b" text-anchor="start">Na⁺/K⁺-ATPase</text><path d="M575 310 L815 310" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><text x="710" y="330" font-size="18" fill="#173d3b" text-anchor="start">Na⁺ sai</text><path d="M810 369 L575 369" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><text x="710" y="395" font-size="18" fill="#173d3b" text-anchor="start">K⁺ entra</text><text x="370" y="321" font-size="19" fill="#173d3b" text-anchor="start">ATP → ADP + Pi</text><text x="370" y="350" font-size="18" fill="#173d3b" text-anchor="start">Mantém o gradiente</text><text x="370" y="375" font-size="18" fill="#173d3b" text-anchor="start">de sódio</text><text x="35" y="476" font-size="18" fill="#173d3b" text-anchor="start">A bomba usa ATP. SGLT1 usa o gradiente de Na⁺; GLUT2 facilita a passagem de glicose.</text><text x="30" y="523" font-size="16" fill="#59726e" text-anchor="start">Esquema didático em português · posições e quantidades não estão em escala</text></svg>