<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" role="img" aria-labelledby="title desc"><title id="title">ATP e cálcio têm papéis diferentes na contração</title><desc id="desc">Ciclo simplificado de uma cabeça de miosina em músculo estriado.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#477b71"/></marker></defs><rect width="1060" height="760" fill="#fffdf7"/><style>text{font-family:Arial,sans-serif;fill:#153b37}.t{font-size:28px;font-weight:700}.s{font-size:18px}.h{font-size:21px;font-weight:700}.b{font-size:18px}.foot{font-size:17px}</style><text class="t" x="40" y="52">ATP e cálcio têm papéis diferentes na contração</text><text class="s" x="40" y="87">Ciclo simplificado de uma cabeça de miosina em músculo estriado.</text><rect x="40" y="130" width="480" height="212" rx="14" fill="#e8f3ee" stroke="#b7ccc1"/><text class="h" x="62" y="168">1 · Desprendimento</text><text class="b" x="62" y="208">Ligação de ATP à miosina favorece</text><text class="b" x="62" y="237">separação da actina. ATP não serve</text><text class="b" x="62" y="266">apenas ao “puxão”: também permite</text><text class="b" x="62" y="295">a continuidade do ciclo.</text><rect x="560" y="130" width="480" height="212" rx="14" fill="#eef0f9" stroke="#b7ccc1"/><text class="h" x="582" y="168">2 · Preparação</text><text class="b" x="582" y="208">Hidrólise de ATP prepara um estado</text><text class="b" x="582" y="237">da cabeça, associado a ADP e Pi.</text><text class="b" x="582" y="266">A conformação muda; os filamentos</text><text class="b" x="582" y="295">não precisam mudar seu comprimento.</text><rect x="40" y="380" width="480" height="212" rx="14" fill="#faf0db" stroke="#b7ccc1"/><text class="h" x="62" y="418">4 · Novo ciclo e relaxamento</text><text class="b" x="62" y="458">Outro ATP permite desprendimento.</text><text class="b" x="62" y="487">Bombas também usam ATP para</text><text class="b" x="62" y="516">reduzir Ca²⁺ no citosol. Sem ATP,</text><text class="b" x="62" y="545">relaxamento não é garantido.</text><rect x="560" y="380" width="480" height="212" rx="14" fill="#edf4f7" stroke="#b7ccc1"/><text class="h" x="582" y="418">3 · Ligação e produção de força</text><text class="b" x="582" y="458">Com locais acessíveis na actina,</text><text class="b" x="582" y="487">a cabeça interage; liberação de Pi</text><text class="b" x="582" y="516">e mudanças conformacionais</text><text class="b" x="582" y="545">participam da produção de força.</text><path d="M527 236 L551 236" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M800 350 L800 370" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M550 488 L528 488" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="40" y="650" width="1000" height="80" rx="10" fill="#f1f1e8"/><text class="foot" x="60" y="679">Ca²⁺ liga-se à troponina e favorece deslocamento da tropomiosina: torna a interação possível.</text><text class="foot" x="60" y="706">Limite: estados intermediários e cooperação de milhares de cabeças foram simplificados.</text></svg>