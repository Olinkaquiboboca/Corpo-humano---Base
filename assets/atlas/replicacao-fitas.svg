<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc"><title id="title">Replicação: por que uma fita é contínua e a outra fragmentada?</title><desc id="desc">Fitas-molde antiparalelas e síntese de DNA no sentido cinco linha para três linha. A forquilha avança para a direita; a fita contínua cresce nesse sentido e os fragmentos da fita descontínua crescem no sentido contrário.</desc><defs><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#347d70"/></marker><marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#8a568f"/></marker></defs><rect width="1080" height="700" fill="#fffdf7"/><style>text{font-family:Arial,sans-serif;fill:#173e39;font-size:20px}.title{font-size:28px;font-weight:700}.small{font-size:17px}.label{font-weight:700}</style><text class="title" x="35" y="48">Replicação: duas fitas, uma direção de síntese</text><text class="small" x="35" y="85">Esquema de uma forquilha que avança para a direita. Cores identificam função, não química real.</text><text class="label" x="45" y="130">Fita-molde superior</text><text x="55" y="175">5′</text><text x="967" y="276">3′</text><path d="M90 170L650 170L755 280L950 280" fill="none" stroke="#bd9e69" stroke-width="8"/><path d="M90 440L650 440L755 310L950 310" fill="none" stroke="#bd9e69" stroke-width="8"/><text x="55" y="447">3′</text><text x="967" y="317">5′</text><text class="label" x="45" y="489">Fita-molde inferior</text><g stroke="#cbb995" stroke-width="2"><path d="M785 280V310M810 280V310M835 280V310M860 280V310M885 280V310M910 280V310M935 280V310"/></g><text class="small" x="780" y="345">DNA ainda não aberto</text><path d="M745 225L948 225" stroke="#347d70" stroke-width="3" marker-end="url(#g)"/><text class="small" x="735" y="197">Avanço da forquilha</text><text class="label" x="40" y="230">Fita nova descontínua</text><path d="M300 260L170 260M510 260L370 260M690 260L570 260" stroke="#8a568f" stroke-width="7" marker-end="url(#p)"/><g fill="#d77555"><rect x="280" y="252" width="20" height="16"/><rect x="490" y="252" width="20" height="16"/><rect x="670" y="252" width="20" height="16"/></g><text class="small" x="153" y="292">3′</text><text class="small" x="295" y="292">5′</text><text class="small" x="354" y="292">3′</text><text class="small" x="505" y="292">5′</text><text class="small" x="554" y="292">3′</text><text class="small" x="685" y="292">5′</text><text class="small" x="180" y="331">Fragmentos de Okazaki: síntese para a esquerda</text><path d="M110 394L686 394" stroke="#347d70" stroke-width="7" marker-end="url(#g)"/><text x="75" y="400">5′</text><text x="695" y="400">3′</text><text class="label" x="160" y="369">Fita nova contínua: síntese para a direita</text><rect x="35" y="535" width="1010" height="135" rx="12" fill="#edf3ee"/><text class="small" x="55" y="569">A DNA polimerase adiciona nucleotídeos à extremidade 3′: toda fita nova cresce 5′ → 3′.</text><text class="small" x="55" y="599">Os retângulos alaranjados representam primers. Depois de processamento, a ligase une trechos.</text><text class="small" x="55" y="629">Limite: não mostra todos os complexos, velocidades, tamanhos nem a organização tridimensional.</text></svg>