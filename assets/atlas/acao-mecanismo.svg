<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" role="img" aria-labelledby="title desc"><title id="title">Por que o potencial de ação sobe e depois termina</title><desc id="desc">A forma do sinal depende do estado dos canais e dos gradientes iônicos.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#477b71"/></marker></defs><rect width="1060" height="760" fill="#fffdf7"/><style>text{font-family:Arial,sans-serif;fill:#153b37}.t{font-size:28px;font-weight:700}.s{font-size:18px}.h{font-size:21px;font-weight:700}.b{font-size:18px}.foot{font-size:17px}</style><text class="t" x="40" y="52">Por que o potencial de ação sobe e depois termina</text><text class="s" x="40" y="87">A forma do sinal depende do estado dos canais e dos gradientes iônicos.</text><rect x="40" y="130" width="480" height="212" rx="14" fill="#e8f3ee" stroke="#b7ccc1"/><text class="h" x="62" y="168">1 · Estado inicial e estímulo</text><text class="b" x="62" y="208">Gradientes são mantidos por transporte.</text><text class="b" x="62" y="237">Canais contribuem ao potencial basal.</text><text class="b" x="62" y="266">Uma despolarização suficiente pode</text><text class="b" x="62" y="295">iniciar abertura regenerativa de Na⁺.</text><rect x="560" y="130" width="480" height="212" rx="14" fill="#eef0f9" stroke="#b7ccc1"/><text class="h" x="582" y="168">2 · Amplificação</text><text class="b" x="582" y="208">Na⁺ entra conforme sua força motriz.</text><text class="b" x="582" y="237">A despolarização favorece abertura</text><text class="b" x="582" y="266">de mais canais de Na⁺ dependentes</text><text class="b" x="582" y="295">de voltagem em muitos neurônios.</text><rect x="40" y="380" width="480" height="212" rx="14" fill="#faf0db" stroke="#b7ccc1"/><text class="h" x="62" y="418">4 · Recuperação e propagação</text><text class="b" x="62" y="458">Estado dos canais causa refratariedade.</text><text class="b" x="62" y="487">Correntes locais influenciam a região</text><text class="b" x="62" y="516">vizinha, onde o sinal é regenerado.</text><text class="b" x="62" y="545">Um íon não percorre todo o axônio.</text><rect x="560" y="380" width="480" height="212" rx="14" fill="#edf4f7" stroke="#b7ccc1"/><text class="h" x="582" y="418">3 · Encerramento da subida</text><text class="b" x="582" y="458">Canais de Na⁺ se inativam.</text><text class="b" x="582" y="487">Aumento da contribuição de K⁺</text><text class="b" x="582" y="516">favorece repolarização conforme</text><text class="b" x="582" y="545">seu gradiente eletroquímico.</text><path d="M527 236 L551 236" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M800 350 L800 370" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M550 488 L528 488" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="40" y="650" width="1000" height="80" rx="10" fill="#f1f1e8"/><text class="foot" x="60" y="679">Bomba mantém gradientes ao longo do tempo; canais produzem mudanças rápidas de permeabilidade.</text><text class="foot" x="60" y="706">Limite: descreve um modelo neuronal comum; outros tipos celulares têm canais e formas diferentes.</text></svg>