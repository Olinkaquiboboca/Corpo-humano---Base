<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>A insulina muda a localização de transportadores de glicose</title><defs><marker id="matter" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d68"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8954ab"/></marker></defs><style>text{font-family:Arial,sans-serif}</style><rect width="960" height="540" fill="#fffdf7"/><text x="30" y="38" font-size="25" fill="#173d3b" text-anchor="start">A insulina muda a localização de transportadores de glicose</text><text x="30" y="90" font-size="21" fill="#173d3b" text-anchor="start">A · Antes do estímulo</text><rect x="25" y="110" width="430" height="315" rx="30" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="40" y="146" font-size="18" fill="#173d3b" text-anchor="start">Líquido extracelular</text><path d="M35 205 H445" stroke="#176d68" stroke-width="10"/><text x="40" y="405" font-size="17" fill="#173d3b" text-anchor="start">Interior: célula muscular ou adiposa</text><rect x="95" y="174" width="32" height="65" rx="4" fill="#f0ddff" stroke="#8954ab" stroke-width="2"/><text x="40" y="169" font-size="16" fill="#173d3b" text-anchor="start">Receptor de insulina</text><circle cx="230" cy="310" r="33" fill="#e9b968"/><rect x="210" y="281" width="24" height="22" rx="3" fill="#fffdf7" stroke="#d38316" stroke-width="2"/><circle cx="185" cy="185" r="6" fill="#d38316"/><circle cx="265" cy="185" r="6" fill="#d38316"/><circle cx="345" cy="185" r="6" fill="#d38316"/><text x="505" y="90" font-size="21" fill="#173d3b" text-anchor="start">B · Após sinalização pela insulina</text><rect x="500" y="110" width="430" height="315" rx="30" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="515" y="146" font-size="18" fill="#173d3b" text-anchor="start">Líquido extracelular</text><path d="M510 205 H920" stroke="#176d68" stroke-width="10"/><text x="515" y="405" font-size="17" fill="#173d3b" text-anchor="start">Interior: célula muscular ou adiposa</text><rect x="570" y="174" width="32" height="65" rx="4" fill="#f0ddff" stroke="#8954ab" stroke-width="2"/><text x="515" y="169" font-size="16" fill="#173d3b" text-anchor="start">Receptor de insulina</text><circle cx="705" cy="310" r="33" fill="#e9b968"/><rect x="685" y="281" width="24" height="22" rx="3" fill="#fffdf7" stroke="#d38316" stroke-width="2"/><circle cx="660" cy="185" r="6" fill="#d38316"/><circle cx="740" cy="185" r="6" fill="#d38316"/><circle cx="820" cy="185" r="6" fill="#d38316"/><circle cx="585" cy="160" r="9" fill="#8954ab"/><path d="M585 247 L670 300" stroke="#8954ab" fill="none" stroke-width="3" marker-end="url(#signal)" stroke-dasharray="8 6"/><path d="M715 278 L765 219" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><rect x="760" y="184" width="35" height="42" rx="4" fill="#fffdf7" stroke="#d38316" stroke-width="2"/><path d="M778 143 L778 276" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><text x="520" y="363" font-size="16" fill="#173d3b" text-anchor="start">Mais GLUT4 na membrana → maior capacidade</text><text x="35" y="464" font-size="18" fill="#173d3b" text-anchor="start">Linha contínua: movimento de matéria. Linha tracejada: etapas de sinalização.</text><text x="35" y="494" font-size="18" fill="#173d3b" text-anchor="start">O receptor recebe insulina; GLUT4 transporta glicose. São proteínas diferentes.</text><text x="30" y="523" font-size="16" fill="#59726e" text-anchor="start">Esquema didático em português · posições e quantidades não estão em escala</text><text x="50" y="375" font-family="Arial" font-size="16" fill="#93601c">Vesícula com GLUT4</text><text x="767" y="244" font-family="Arial" font-size="16" fill="#93601c">GLUT4</text><text x="780" y="290" fill="#173d3b" font-size="17">Glicose →</text><text x="780" y="316" fill="#173d3b" font-size="17">glicose-6-fosfato</text><text x="285" y="285" fill="#173d3b" font-size="17">Parte de GLUT4</text><text x="285" y="315" fill="#173d3b" font-size="17">está em vesículas</text></svg>