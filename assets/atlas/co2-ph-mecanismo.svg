<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" role="img" aria-labelledby="title desc"><title id="title">CO₂, bicarbonato e pH: seguir a reação evita inverter a seta</title><desc id="desc">CO₂ + H₂O ⇄ H₂CO₃ ⇄ H⁺ + HCO₃⁻  ·  sistema simplificado.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#477b71"/></marker></defs><rect width="1060" height="760" fill="#fffdf7"/><style>text{font-family:Arial,sans-serif;fill:#153b37}.t{font-size:28px;font-weight:700}.s{font-size:18px}.h{font-size:21px;font-weight:700}.b{font-size:18px}.foot{font-size:17px}</style><text class="t" x="40" y="52">CO₂, bicarbonato e pH: seguir a reação evita inverter a seta</text><text class="s" x="40" y="87">CO₂ + H₂O ⇄ H₂CO₃ ⇄ H⁺ + HCO₃⁻  ·  sistema simplificado.</text><rect x="40" y="130" width="480" height="212" rx="14" fill="#e8f3ee" stroke="#b7ccc1"/><text class="h" x="62" y="168">1 · Produção e transporte</text><text class="b" x="62" y="208">Metabolismo produz CO₂.</text><text class="b" x="62" y="237">Sangue transporta carbono em formas</text><text class="b" x="62" y="266">que incluem bicarbonato, CO₂ dissolvido</text><text class="b" x="62" y="295">e associações com proteínas.</text><rect x="560" y="130" width="480" height="212" rx="14" fill="#eef0f9" stroke="#b7ccc1"/><text class="h" x="582" y="168">2 · Aumento de CO₂</text><text class="b" x="582" y="208">Mantidas outras condições,</text><text class="b" x="582" y="237">aumento de CO₂ favorece aumento</text><text class="b" x="582" y="266">de H⁺ e redução do pH.</text><text class="b" x="582" y="295">A relação depende do sistema inteiro.</text><rect x="40" y="380" width="480" height="212" rx="14" fill="#faf0db" stroke="#b7ccc1"/><text class="h" x="62" y="418">4 · Participação renal</text><text class="b" x="62" y="458">Rins recuperam bicarbonato filtrado</text><text class="b" x="62" y="487">e participam da excreção de ácido</text><text class="b" x="62" y="516">e geração de novo bicarbonato.</text><text class="b" x="62" y="545">Compensação não remove toda causa.</text><rect x="560" y="380" width="480" height="212" rx="14" fill="#edf4f7" stroke="#b7ccc1"/><text class="h" x="582" y="418">3 · Remoção pela ventilação</text><text class="b" x="582" y="458">Eliminar mais CO₂ pode reduzir H⁺</text><text class="b" x="582" y="487">e elevar pH, conforme condições.</text><text class="b" x="582" y="516">Pulmões modificam uma parte</text><text class="b" x="582" y="545">do sistema tampão conectado.</text><path d="M527 236 L551 236" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M800 350 L800 370" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M550 488 L528 488" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="40" y="650" width="1000" height="80" rx="10" fill="#f1f1e8"/><text class="foot" x="60" y="679">Tampões agem rapidamente; ventilação e funções renais têm dinâmicas próprias e interdependentes.</text><text class="foot" x="60" y="706">Limite: esquema de causa condicional; não é algoritmo de diagnóstico nem mostra todos os tampões.</text></svg>