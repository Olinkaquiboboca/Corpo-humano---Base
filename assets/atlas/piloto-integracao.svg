<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Agora reúna os mecanismos: oferta variável, necessidades contínuas</title><defs><marker id="matter" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d68"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8954ab"/></marker></defs><style>text{font-family:Arial,sans-serif}</style><rect width="960" height="540" fill="#fffdf7"/><text x="30" y="38" font-size="25" fill="#173d3b" text-anchor="start">Agora reúna os mecanismos: oferta variável, necessidades contínuas</text><rect x="25" y="75" width="430" height="385" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="45" y="114" font-size="23" fill="#173d3b" text-anchor="start">Após uma refeição</text><rect x="50" y="140" width="380" height="70" rx="16" fill="#fff0d6" stroke="#d38316" stroke-width="2"/><text x="70" y="170" font-size="17" fill="#173d3b" text-anchor="start">Sangue: entrada de nutrientes do intestino</text><text x="70" y="194" font-size="16" fill="#173d3b" text-anchor="start">Sinalização de insulina favorecida</text><path d="M135 220 L135 256" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><rect x="45" y="265" width="180" height="100" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="60" y="298" font-size="21" fill="#173d3b" text-anchor="start">Fígado</text><text x="60" y="328" font-size="17" fill="#173d3b" text-anchor="start">Uso e</text><text x="60" y="352" font-size="17" fill="#173d3b" text-anchor="start">armazenamento</text><path d="M310 220 L310 256" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><rect x="245" y="265" width="185" height="100" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="260" y="298" font-size="21" fill="#173d3b" text-anchor="start">Músculo</text><text x="260" y="328" font-size="17" fill="#173d3b" text-anchor="start">Uso e reserva</text><text x="260" y="352" font-size="17" fill="#173d3b" text-anchor="start">local</text><text x="45" y="408" font-size="16" fill="#173d3b" text-anchor="start">Tecido adiposo: armazenamento favorecido</text><rect x="500" y="75" width="430" height="385" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="520" y="114" font-size="23" fill="#173d3b" text-anchor="start">Entre refeições</text><rect x="525" y="140" width="380" height="70" rx="16" fill="#fff0d6" stroke="#d38316" stroke-width="2"/><text x="545" y="170" font-size="17" fill="#173d3b" text-anchor="start">Sangue: oferta mantida por reservas</text><text x="545" y="194" font-size="16" fill="#173d3b" text-anchor="start">Insulina menor; glucagon relativamente maior</text><path d="M610 260 L610 220" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><rect x="520" y="265" width="180" height="100" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="535" y="298" font-size="21" fill="#173d3b" text-anchor="start">Fígado</text><text x="535" y="328" font-size="17" fill="#173d3b" text-anchor="start">Libera e</text><text x="535" y="352" font-size="17" fill="#173d3b" text-anchor="start">produz glicose</text><path d="M785 220 L785 256" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><rect x="720" y="265" width="185" height="100" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="735" y="298" font-size="21" fill="#173d3b" text-anchor="start">Tecidos</text><text x="735" y="328" font-size="17" fill="#173d3b" text-anchor="start">Usam</text><text x="735" y="352" font-size="17" fill="#173d3b" text-anchor="start">combustíveis</text><text x="735" y="376" font-size="17" fill="#173d3b" text-anchor="start">disponíveis</text><text x="520" y="408" font-size="17" fill="#173d3b" text-anchor="start">Tecido adiposo: mobilização de lipídios</text><text x="35" y="496" font-size="18" fill="#173d3b" text-anchor="start">São tendências de fluxos simultâneos. Não há um interruptor único para o corpo inteiro.</text><text x="30" y="523" font-size="16" fill="#59726e" text-anchor="start">Esquema didático em português · posições e quantidades não estão em escala</text></svg>