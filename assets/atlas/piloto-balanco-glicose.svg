<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>A glicemia resulta de fluxos, não de uma reserva isolada</title><defs><marker id="matter" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d68"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8954ab"/></marker></defs><style>text{font-family:Arial,sans-serif}</style><rect width="960" height="540" fill="#fffdf7"/><text x="30" y="38" font-size="25" fill="#173d3b" text-anchor="start">A glicemia resulta de fluxos, não de uma reserva isolada</text><rect x="335" y="150" width="290" height="220" rx="16" fill="#fff0d6" stroke="#d38316" stroke-width="2"/><text x="480" y="190" font-size="24" fill="#173d3b" text-anchor="middle">SANGUE</text><text x="365" y="240" font-size="20" fill="#173d3b" text-anchor="start">Glicose circulante:</text><text x="365" y="267" font-size="20" fill="#173d3b" text-anchor="start">quantidade depende das</text><text x="365" y="294" font-size="20" fill="#173d3b" text-anchor="start">entradas e das saídas.</text><rect x="25" y="80" width="250" height="120" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="43" y="115" font-size="23" fill="#173d3b" text-anchor="start">Intestino</text><text x="43" y="150" font-size="20" fill="#173d3b" text-anchor="start">Glicose absorvida</text><rect x="25" y="310" width="250" height="120" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="43" y="345" font-size="23" fill="#173d3b" text-anchor="start">Fígado</text><text x="43" y="380" font-size="20" fill="#173d3b" text-anchor="start">Glicose liberada</text><rect x="685" y="175" width="250" height="120" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="703" y="210" font-size="23" fill="#173d3b" text-anchor="start">Tecidos</text><text x="703" y="245" font-size="20" fill="#173d3b" text-anchor="start">Captação e utilização</text><path d="M280 140 L325 185" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><path d="M280 360 L325 320" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><path d="M632 260 L675 240" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><text x="35" y="485" font-size="19" fill="#173d3b" text-anchor="start">Mais saída que entrada → quantidade diminui. Mais entrada que saída → aumenta.</text><text x="30" y="523" font-size="16" fill="#59726e" text-anchor="start">Esquema didático em português · posições e quantidades não estão em escala</text></svg>