<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" role="img" aria-labelledby="title desc"><title id="title">Da transferência de elétrons à síntese de ATP</title><desc id="desc">Quatro relações moleculares: a energia é transferida, e o carbono não vira energia.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#477b71"/></marker></defs><rect width="1060" height="760" fill="#fffdf7"/><style>text{font-family:Arial,sans-serif;fill:#153b37}.t{font-size:28px;font-weight:700}.s{font-size:18px}.h{font-size:21px;font-weight:700}.b{font-size:18px}.foot{font-size:17px}</style><text class="t" x="40" y="52">Da transferência de elétrons à síntese de ATP</text><text class="s" x="40" y="87">Quatro relações moleculares: a energia é transferida, e o carbono não vira energia.</text><rect x="40" y="130" width="480" height="212" rx="14" fill="#e8f3ee" stroke="#b7ccc1"/><text class="h" x="62" y="168">1 · Transportadores reduzidos</text><text class="b" x="62" y="208">NADH e FADH₂ fornecem elétrons</text><text class="b" x="62" y="237">à cadeia na membrana interna.</text><text class="b" x="62" y="266">Os complexos não são uma tubulação:</text><text class="b" x="62" y="295">realizam transferências entre moléculas.</text><rect x="560" y="130" width="480" height="212" rx="14" fill="#eef0f9" stroke="#b7ccc1"/><text class="h" x="582" y="168">2 · Separação de prótons</text><text class="b" x="582" y="208">Parte das transferências favorece</text><text class="b" x="582" y="237">bombeamento de H⁺ para o espaço</text><text class="b" x="582" y="266">intermembranar. Concentração e carga</text><text class="b" x="582" y="295">contribuem ao gradiente eletroquímico.</text><rect x="40" y="380" width="480" height="212" rx="14" fill="#faf0db" stroke="#b7ccc1"/><text class="h" x="62" y="418">4 · Formação de ATP</text><text class="b" x="62" y="458">H⁺ retorna à matriz pela ATP sintase.</text><text class="b" x="62" y="487">A proteína acopla esse fluxo à reação</text><text class="b" x="62" y="516">ADP + fosfato → ATP. O gradiente</text><text class="b" x="62" y="545">precisa ser continuamente sustentado.</text><rect x="560" y="380" width="480" height="212" rx="14" fill="#edf4f7" stroke="#b7ccc1"/><text class="h" x="582" y="418">3 · Papel do oxigênio</text><text class="b" x="582" y="458">O₂ recebe elétrons ao fim da cadeia</text><text class="b" x="582" y="487">e participa da formação de água.</text><text class="b" x="582" y="516">Sem continuidade desse fluxo,</text><text class="b" x="582" y="545">a manutenção do gradiente é afetada.</text><path d="M527 236 L551 236" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M800 350 L800 370" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M550 488 L528 488" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="40" y="650" width="1000" height="80" rx="10" fill="#f1f1e8"/><text class="foot" x="60" y="679">Localização: cadeia e ATP sintase na membrana interna; ciclo do ácido cítrico na matriz.</text><text class="foot" x="60" y="706">Limite: esquema qualitativo. Não mostra todos os complexos nem uma estequiometria completa.</text></svg>