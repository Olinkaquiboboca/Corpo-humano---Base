<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Como a célula beta transforma glicose disponível em secreção</title><defs><marker id="matter" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d68"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8954ab"/></marker></defs><style>text{font-family:Arial,sans-serif}</style><rect width="960" height="540" fill="#fffdf7"/><text x="30" y="38" font-size="25" fill="#173d3b" text-anchor="start">Como a célula beta transforma glicose disponível em secreção</text><rect x="25" y="110" width="430" height="330" rx="35" fill="#f0f7ff" stroke="#4f76a2" stroke-width="2"/><text x="43" y="86" font-size="22" fill="#173d3b" text-anchor="start">A · Menor estímulo por glicose</text><text x="210" y="145" font-size="18" fill="#173d3b" text-anchor="start">Exterior da célula</text><text x="45" y="418" font-size="19" fill="#173d3b" text-anchor="start">Interior da célula beta</text><path d="M35 200 H445" stroke="#4f76a2" stroke-width="10"/><rect x="110" y="182" width="48" height="36" rx="4" fill="#f8de9e" stroke="#d38316" stroke-width="2"/><rect x="290" y="182" width="48" height="36" rx="4" fill="#cfd3ff" stroke="#8954ab" stroke-width="2"/><text x="165" y="185" font-size="15" fill="#173d3b" text-anchor="start">Canal KATP</text><text x="255" y="175" font-size="16" fill="#173d3b" text-anchor="start">Canal de Ca²⁺</text><path d="M135 260 L135 135" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><text x="180" y="259" font-size="19" fill="#173d3b" text-anchor="start">K⁺ sai pelo canal</text><text x="180" y="296" font-size="18" fill="#173d3b" text-anchor="start">Canal de Ca²⁺ pouco ativo</text><text x="180" y="333" font-size="19" fill="#173d3b" text-anchor="start">Grânulos permanecem</text><text x="180" y="360" font-size="17" fill="#173d3b" text-anchor="start">majoritariamente armazenados</text><circle cx="95" cy="345" r="18" fill="#8954ab"/><rect x="500" y="110" width="430" height="330" rx="35" fill="#f0f7ff" stroke="#4f76a2" stroke-width="2"/><text x="518" y="86" font-size="22" fill="#173d3b" text-anchor="start">B · Mais glicose disponível</text><text x="520" y="149" font-size="18" fill="#173d3b" text-anchor="start">Exterior da célula</text><text x="520" y="418" font-size="19" fill="#173d3b" text-anchor="start">Interior da célula beta</text><path d="M510 200 H920" stroke="#4f76a2" stroke-width="10"/><rect x="585" y="182" width="48" height="36" rx="4" fill="#f8de9e" stroke="#d38316" stroke-width="2"/><rect x="765" y="182" width="48" height="36" rx="4" fill="#cfd3ff" stroke="#8954ab" stroke-width="2"/><text x="555" y="175" font-size="16" fill="#173d3b" text-anchor="start">Canal KATP</text><text x="730" y="175" font-size="16" fill="#173d3b" text-anchor="start">Canal de Ca²⁺</text><text x="515" y="255" font-size="19" fill="#173d3b" text-anchor="start">1 · Metabolismo → ATP/ADP ↑</text><text x="515" y="290" font-size="19" fill="#173d3b" text-anchor="start">2 · Canal KATP fecha</text><text x="515" y="325" font-size="19" fill="#173d3b" text-anchor="start">3 · Membrana despolariza</text><text x="515" y="360" font-size="18" fill="#173d3b" text-anchor="start">4 · Ca²⁺ entra; grânulos se fundem</text><text x="590" y="207" font-size="22" fill="#173d3b" text-anchor="start">×</text><path d="M790 150 L790 233" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><path d="M865 295 L865 130" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><circle cx="865" cy="300" r="18" fill="#8954ab"/><circle cx="865" cy="115" r="6" fill="#8954ab"/><text x="35" y="480" font-size="19" fill="#173d3b" text-anchor="start">ATP não é o hormônio: altera canais. Ca²⁺ é o sinal que desencadeia a exocitose.</text><text x="30" y="523" font-size="16" fill="#59726e" text-anchor="start">Esquema didático em português · posições e quantidades não estão em escala</text></svg>