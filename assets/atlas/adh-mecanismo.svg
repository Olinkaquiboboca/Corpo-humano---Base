<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" role="img" aria-labelledby="title desc"><title id="title">Da detecção de uma demanda à conservação de água</title><desc id="desc">Neurônio → hormônio → receptor → vesícula → membrana → movimento de água.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#477b71"/></marker></defs><rect width="1060" height="760" fill="#fffdf7"/><style>text{font-family:Arial,sans-serif;fill:#153b37}.t{font-size:28px;font-weight:700}.s{font-size:18px}.h{font-size:21px;font-weight:700}.b{font-size:18px}.foot{font-size:17px}</style><text class="t" x="40" y="52">Da detecção de uma demanda à conservação de água</text><text class="s" x="40" y="87">Neurônio → hormônio → receptor → vesícula → membrana → movimento de água.</text><rect x="40" y="130" width="480" height="212" rx="14" fill="#e8f3ee" stroke="#b7ccc1"/><text class="h" x="62" y="168">1 · Sinal e liberação</text><text class="b" x="62" y="208">Condições osmóticas e circulatórias</text><text class="b" x="62" y="237">influenciam circuitos hipotalâmicos.</text><text class="b" x="62" y="266">ADH é produzido no hipotálamo e</text><text class="b" x="62" y="295">liberado por terminais na neuro-hipófise.</text><rect x="560" y="130" width="480" height="212" rx="14" fill="#eef0f9" stroke="#b7ccc1"/><text class="h" x="582" y="168">2 · Reconhecimento no rim</text><text class="b" x="582" y="208">ADH liga-se a receptores V₂</text><text class="b" x="582" y="237">em células de regiões apropriadas.</text><text class="b" x="582" y="266">A sinalização modifica o tráfego</text><text class="b" x="582" y="295">de vesículas com aquaporina-2.</text><rect x="40" y="380" width="480" height="212" rx="14" fill="#faf0db" stroke="#b7ccc1"/><text class="h" x="62" y="418">4 · Efeito sobre o organismo</text><text class="b" x="62" y="458">Menor perda urinária de água pode</text><text class="b" x="62" y="487">contribuir ao balanço corporal.</text><text class="b" x="62" y="516">A resposta depende da integridade</text><text class="b" x="62" y="545">das etapas e da organização renal.</text><rect x="560" y="380" width="480" height="212" rx="14" fill="#edf4f7" stroke="#b7ccc1"/><text class="h" x="582" y="418">3 · Permeabilidade e gradiente</text><text class="b" x="582" y="458">Aquaporina-2 na membrana apical</text><text class="b" x="582" y="487">facilita passagem de água.</text><text class="b" x="582" y="516">Água segue um gradiente osmótico:</text><text class="b" x="582" y="545">ADH não bombeia água diretamente.</text><path d="M527 236 L551 236" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M800 350 L800 370" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M550 488 L528 488" stroke="#477b71" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="40" y="650" width="1000" height="80" rx="10" fill="#f1f1e8"/><text class="foot" x="60" y="679">ADH e aldosterona cooperam em contextos específicos, mas regulam mecanismos diferentes.</text><text class="foot" x="60" y="706">Limite: não mostra a arquitetura renal inteira nem todas as vias de sinalização.</text></svg>