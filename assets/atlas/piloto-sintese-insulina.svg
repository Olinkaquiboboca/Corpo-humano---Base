<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Produzir insulina e liberar insulina são processos diferentes</title><defs><marker id="matter" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d68"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8954ab"/></marker></defs><style>text{font-family:Arial,sans-serif}</style><rect width="960" height="540" fill="#fffdf7"/><text x="30" y="38" font-size="25" fill="#173d3b" text-anchor="start">Produzir insulina e liberar insulina são processos diferentes</text><rect x="25" y="90" width="220" height="135" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="45" y="125" font-size="21" fill="#173d3b" text-anchor="start">Núcleo e ribossomo</text><text x="45" y="161" font-size="18" fill="#173d3b" text-anchor="start">Gene INS → RNA</text><text x="45" y="186" font-size="18" fill="#173d3b" text-anchor="start">mensageiro →</text><text x="45" y="211" font-size="18" fill="#173d3b" text-anchor="start">precursor proteico</text><rect x="325" y="90" width="280" height="135" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="345" y="125" font-size="20" fill="#173d3b" text-anchor="start">Retículo endoplasmático</text><text x="345" y="161" font-size="18" fill="#173d3b" text-anchor="start">Remoção do peptídeo</text><text x="345" y="186" font-size="18" fill="#173d3b" text-anchor="start">sinal; dobramento da</text><text x="345" y="211" font-size="18" fill="#173d3b" text-anchor="start">proinsulina</text><rect x="695" y="90" width="240" height="135" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="715" y="125" font-size="23" fill="#173d3b" text-anchor="start">Golgi</text><text x="715" y="161" font-size="18" fill="#173d3b" text-anchor="start">Separação e</text><text x="715" y="186" font-size="18" fill="#173d3b" text-anchor="start">encaminhamento para</text><text x="715" y="211" font-size="18" fill="#173d3b" text-anchor="start">grânulos</text><path d="M252 157 L314 157" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><path d="M614 157 L684 157" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><path d="M815 238 L815 286" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><rect x="530" y="300" width="405" height="170" rx="16" fill="#f8efff" stroke="#8954ab" stroke-width="2"/><text x="550" y="335" font-size="23" fill="#173d3b" text-anchor="start">Grânulo secretor</text><text x="550" y="370" font-size="19" fill="#173d3b" text-anchor="start">Proinsulina é processada: insulina</text><text x="550" y="396" font-size="19" fill="#173d3b" text-anchor="start">madura + peptídeo C. Produtos</text><text x="550" y="422" font-size="19" fill="#173d3b" text-anchor="start">ficam disponíveis para secreção.</text><rect x="25" y="300" width="400" height="170" rx="16" fill="#eef8f6" stroke="#176d68" stroke-width="2"/><text x="45" y="335" font-size="23" fill="#173d3b" text-anchor="start">Liberação quando há estímulo</text><text x="45" y="370" font-size="19" fill="#173d3b" text-anchor="start">O grânulo se funde à membrana. Seu</text><text x="45" y="396" font-size="19" fill="#173d3b" text-anchor="start">conteúdo alcança o meio</text><text x="45" y="422" font-size="19" fill="#173d3b" text-anchor="start">extracelular e os capilares.</text><path d="M520 388 L438 388" stroke="#176d68" fill="none" stroke-width="3" marker-end="url(#matter)"/><text x="30" y="523" font-size="16" fill="#59726e" text-anchor="start">Esquema didático em português · posições e quantidades não estão em escala</text></svg>